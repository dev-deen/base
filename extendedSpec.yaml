openapi: 3.0.0
info:
  title: Extended User Management API
  description: Extended API that references shared components from the remotely hosted base specification
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production server

paths:
  /auth/login:
    post:
      summary: User login
      operationId: loginUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'https://dev-deen.github.io/base/baseV1.yaml#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: 'https://dev-deen.github.io/base/baseV1.yaml#/components/schemas/AuthToken'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: 'https://dev-deen.github.io/base/baseV1.yaml#/components/schemas/Error'

  /users/profile:
    get:
      summary: Get current user profile
      operationId: getCurrentUserProfile
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: 'https://dev-deen.github.io/base/baseV1.yaml#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: 'https://dev-deen.github.io/base/baseV1.yaml#/components/schemas/Error'

  /users/{userId}:
    get:
      summary: Get user by ID
      operationId: getUserById
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: 'https://dev-deen.github.io/base/baseV1.yaml#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: 'https://dev-deen.github.io/base/baseV1.yaml#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
