name: Sync Central specification

on:
  push:
    branches:
      - dev
    paths:
      - 'baseV1.yaml'
  workflow_dispatch:

jobs:
  sync-to-downstream:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        repo: ['downstream-1', 'downstream-2', 'downstream-3']

    permissions:
      contents: read

    steps:
      - name: Checkout base repo
        uses: actions/checkout@v4

      - name: Trigger sync in ${{ matrix.repo }}
        run: |
          echo "Triggering repository_dispatch for ${{ matrix.repo }}..."
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WORKFLOW_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dev-deen/${{ matrix.repo }}/dispatches \
            -d '{"event_type":"sync-spec","client_payload":{"source":"base-repo","branch":"dev"}}'
          
          echo "✓ Triggered successfully for ${{ matrix.repo }}"


